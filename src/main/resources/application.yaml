server:
  port: 8080

spring:
  application:
    name: in-scope
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: in_scope
  flyway:
    schemas: in_scope
    default-schema: in_scope
    create-schemas: true
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  freemarker:
    template-loader-path: classpath:/templates/email/
    suffix: .ftlh
    charset: UTF-8
    check-template-location: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

in-scope:
  bunny:
    storage-host: br.storage.bunnycdn.com
    storage-zone: in-scope
  jwt:
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
