server:
  port: ${SERVER_PORT}

spring:
  application:
    name: in-scope
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: in_scope
  flyway:
    schemas: in_scope
    default-schema: in_scope
    create-schemas: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

in-scope:
  cors:
    allowed-origins: ${IN_SCOPE_CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${IN_SCOPE_JWT_SECRET}
    expiration-ms: ${IN_SCOPE_JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${IN_SCOPE_JWT_REFRESH_EXPIRATION_MS}
