databases:
  - name: inscope-db
    databaseName: in_scope_db
    user: in_scope_user
    plan: basic-256mb

services:
  - type: web
    name: inscope-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://${{inscope-db.host}}:${{inscope-db.port}}/${{inscope-db.name}}"
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: inscope-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: inscope-db
          property: password
      - key: IN_SCOPE_JWT_SECRET
        generateValue: true
      - key: IN_SCOPE_JWT_EXPIRATION_MS
        value: "86400000"
      - key: IN_SCOPE_JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: SERVER_PORT
        value: "10000"
      - key: IN_SCOPE_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false